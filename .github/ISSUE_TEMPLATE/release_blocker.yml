name: Release blocker
description: Track critical blockers for Android releases.
title: "[Release Blocker]: "
labels:
  - type:release
  - priority:p0
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What release is blocked and why?
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: Environment - App version
      placeholder: e.g. 1.2.3-rc1
    validations:
      required: true

  - type: input
    id: build_number
    attributes:
      label: Environment - Build number
      placeholder: e.g. 789
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Environment - Device
      placeholder: e.g. Pixel 7 Pro
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: Environment - Android version
      placeholder: e.g. Android 14
    validations:
      required: true

  - type: dropdown
    id: play_track
    attributes:
      label: Play track
      options:
        - internal
        - closed
        - production
    validations:
      required: true

  - type: input
    id: firebase_project_id
    attributes:
      label: Firebase project id
      placeholder: e.g. peopledex-prod
    validations:
      required: true

  - type: input
    id: package_name
    attributes:
      label: Package name
      placeholder: e.g. com.example.peopledex
    validations:
      required: true

  - type: textarea
    id: repro_steps
    attributes:
      label: Repro steps
      description: Include preconditions and exact sequence.
    validations:
      required: true

  - type: textarea
    id: expected_result
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual_result
    attributes:
      label: Actual result
    validations:
      required: true

  - type: textarea
    id: logs_screenshots
    attributes:
      label: Logs or screenshots
      description: Include release, billing, or App Check evidence with sensitive data removed.
    validations:
      required: false

  - type: dropdown
    id: severity_impact
    attributes:
      label: Severity and impact
      options:
        - p0 - Cannot release or critical monetization outage
        - p1 - Release risk with constrained workaround
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: List explicit conditions required to unblock release.
    validations:
      required: true
