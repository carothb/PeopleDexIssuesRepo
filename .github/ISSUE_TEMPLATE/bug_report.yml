name: Something isn't working
description: Tell us about a problem you ran into in the app.
title: "[Problem]: "
labels:
  - type:bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for letting us know something went wrong.
        Please answer as many questions as you can. Simple answers are totally fine.

  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: Tell us what happened.
      placeholder: I tried to open my profile and the app closed.
    validations:
      required: true

  - type: textarea
    id: repro_steps
    attributes:
      label: What were you doing when it happened?
      description: If you can, list the steps.
      placeholder: |
        1. Opened the app
        2. Tapped on ...
        3. Saw ...
    validations:
      required: true

  - type: textarea
    id: expected_result
    attributes:
      label: What did you expect to happen?
      placeholder: I expected the page to open normally.
    validations:
      required: true

  - type: textarea
    id: actual_result
    attributes:
      label: What happened instead?
      placeholder: The screen froze and then the app closed.
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App version (if you know it)
      placeholder: e.g. 1.2.3
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: Device or phone model (if you know it)
      placeholder: e.g. iPhone 14 or Pixel 8
    validations:
      required: false

  - type: input
    id: os_version
    attributes:
      label: Phone software version (optional)
      placeholder: e.g. iOS 18 or Android 15
    validations:
      required: false

  - type: textarea
    id: logs_screenshots
    attributes:
      label: Screenshot or extra details (optional)
      description: You can drag in a screenshot if that helps.
    validations:
      required: false
