name: Help request
description: Ask a question or tell us where you got stuck.
title: "[Help]: "
labels:
  - type:task
body:
  - type: markdown
    attributes:
      value: |
        If you are confused, stuck, or not sure what to do, use this form.

  - type: textarea
    id: need_help_with
    attributes:
      label: What do you need help with?
      description: Tell us your question or where you got stuck.
      placeholder: I’m not sure how to update my profile photo.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you tried so far? (optional)
      placeholder: I tapped edit profile but couldn’t find the photo option.
    validations:
      required: false

  - type: textarea
    id: extra_details
    attributes:
      label: Extra details (optional)
      description: Add screenshots or anything else that may help us understand.
    validations:
      required: false
